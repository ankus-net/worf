name: Release

# Runs on a v* tag: CI, then a package for each PostgreSQL version and platform, then a GitHub release with the
# packages and their SHA-256 checksums. A tag with a hyphen, such as v0.1.0-rc1, makes a prerelease.

on:
  push:
    tags:
      - 'v*'

# Only the job that publishes the release can write to the repository.
permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  # The packages take their version from the tag and their SQL from the extension, so a tag that doesn't match the
  # extension's version stops the release before anything is built.
  version:
    name: Check the version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare the tag with the extension version
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version%%-*}"
          project=$(sed -n 's:.*<AnkusExtensionVersion>\(.*\)</AnkusExtensionVersion>.*:\1:p' src/Worf/Worf.csproj)
          source=$(sed -n 's:.*const string Version = "\(.*\)";.*:\1:p' src/Worf/Worf.cs)
          if [[ "$project" != "$version" || "$source" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is version $version, but AnkusExtensionVersion in src/Worf/Worf.csproj is '$project' and Worf.Version in src/Worf/Worf.cs is '$source'. Set both to $version before tagging."
            exit 1
          fi

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  package:
    name: Package PostgreSQL ${{ matrix.postgresql }} for ${{ matrix.platform }}
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x64, osx-arm64, osx-x64, win-x64]
        postgresql: [15, 16, 17, 18, 19]
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: osx-arm64
            runner: macos-15
          - platform: osx-x64
            runner: macos-15-intel
          - platform: win-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Packages are built against PostgreSQL without assertions, as installations users run are.
      - uses: ./.github/actions/setup
        with:
          platform: ${{ matrix.platform }}
          postgresql: ${{ matrix.postgresql }}
          release: true

      - name: Install WiX (Windows)
        if: runner.os == 'Windows'
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Package
        shell: bash
        run: dotnet run eng/package.cs -- --pg ${{ matrix.postgresql }} --version "${GITHUB_REF_NAME#v}" --output artifacts/packages

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.platform }}-pg${{ matrix.postgresql }}
          path: |
            artifacts/packages/*.tar.gz
            artifacts/packages/*.zip
            artifacts/packages/*.msi
          if-no-files-found: error

  release:
    name: Publish the release
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: packages
          pattern: package-*
          merge-multiple: true

      - name: Write checksums
        working-directory: packages
        run: sha256sum * > SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" \
            --title "worf ${GITHUB_REF_NAME#v}" --generate-notes "${prerelease[@]}"
