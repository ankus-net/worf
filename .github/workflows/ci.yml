name: CI

on:
  push:
  pull_request:
  schedule:
    # The nightly run adds the huge_tx tests and a stress run.
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  test:
    name: PostgreSQL ${{ matrix.postgresql }} on ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x64, osx-arm64, win-x64]
        postgresql: [13, 14, 15, 16, 17, 18, 19]
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: osx-arm64
            runner: macos-15
          - platform: win-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install LLVM and PostgreSQL build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor --yes --output /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-20 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang-20 libclang-20-dev bison flex libreadline-dev zlib1g-dev libicu-dev pkg-config
          echo /usr/lib/llvm-20/bin >> "$GITHUB_PATH"

      - name: Install LLVM and PostgreSQL build dependencies (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          # Homebrew links a versioned LLVM only when no other version is installed; with the runner image's
          # llvm@18 present it leaves llvm@20 unlinked and warns.
          if brew list --versions llvm@18 > /dev/null; then brew uninstall --ignore-dependencies llvm@18; fi
          brew install llvm@20 icu4c pkg-config
          echo "$(brew --prefix llvm@20)/bin" >> "$GITHUB_PATH"

      - name: Select LLVM and diff (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "C:\\Program Files\\LLVM\\bin" >> "$GITHUB_PATH"
          echo "C:\\Program Files\\Git\\usr\\bin" >> "$GITHUB_PATH"

      - name: Restore tools
        run: dotnet tool restore

      - name: Cache PostgreSQL
        uses: actions/cache@v6
        with:
          path: ~/.ankus/postgres
          key: postgresql-v1-${{ matrix.platform }}-pg${{ matrix.postgresql }}-${{ hashFiles('.config/dotnet-tools.json') }}

      - name: Install PostgreSQL
        id: install
        # EDB publishes no Windows archive for a PostgreSQL release candidate, so the next steps build it instead;
        # https://github.com/ankus-net/ankus/issues/79
        continue-on-error: ${{ runner.os == 'Windows' && matrix.postgresql == 19 }}
        run: dotnet ankus init --pg${{ matrix.postgresql }} download

      - name: Select PostgreSQL source (Windows)
        id: source
        if: steps.install.outcome == 'failure'
        shell: pwsh
        run: |
          $listing = (Invoke-WebRequest https://ftp.postgresql.org/pub/source/ -UseBasicParsing).Content
          $version = [regex]::Matches($listing, 'href="v(${{ matrix.postgresql }}(?:beta|rc)\d+)/"') |
            ForEach-Object { $_.Groups[1].Value } |
            Sort-Object { $_ -replace 'beta', '0.' -replace 'rc', '1.' } |
            Select-Object -Last 1
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Cache PostgreSQL source build (Windows)
        id: source-cache
        if: steps.install.outcome == 'failure'
        uses: actions/cache@v6
        with:
          path: C:\pgsql-${{ steps.source.outputs.version }}
          key: postgresql-source-v1-${{ matrix.platform }}-${{ steps.source.outputs.version }}

      - name: Build PostgreSQL from source (Windows)
        if: steps.install.outcome == 'failure' && steps.source-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = '${{ steps.source.outputs.version }}'
          python -m pip install --quiet meson ninja
          choco install winflexbison3 --no-progress -y
          Invoke-WebRequest "https://ftp.postgresql.org/pub/source/v$version/postgresql-$version.tar.bz2" -OutFile "$env:RUNNER_TEMP\postgresql.tar.bz2"
          # Git's tar, which is earlier on the PATH, reads a drive letter as a remote host.
          & "$env:SystemRoot\System32\tar.exe" -xjf "$env:RUNNER_TEMP\postgresql.tar.bz2" -C $env:RUNNER_TEMP
          meson setup --vsenv --buildtype=release --prefix="C:\pgsql-$version" "$env:RUNNER_TEMP\postgresql-build" "$env:RUNNER_TEMP\postgresql-$version"
          meson install -C "$env:RUNNER_TEMP\postgresql-build"

      - name: Register PostgreSQL source build (Windows)
        if: steps.install.outcome == 'failure'
        run: dotnet ankus init --pg${{ matrix.postgresql }} "C:\pgsql-${{ steps.source.outputs.version }}\bin\pg_config.exe"

      - name: Run regression suite
        run: dotnet run eng/regress.cs -- --pg ${{ matrix.postgresql }}

      - name: Save regression results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regression-${{ matrix.platform }}-pg${{ matrix.postgresql }}
          path: |
            src/Worf/pg_regress/results/
            src/Worf/pg_regress/regression.diffs
            artifacts/regress-home/clusters/*.log
          if-no-files-found: ignore
          retention-days: 7
