name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  schedule:
    # The nightly run, on Linux, builds PostgreSQL without assertions and adds a stress run.
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      nightly:
        description: Run the nightly configuration
        type: boolean
        default: false

permissions:
  contents: read

# A newer run for the same branch and event replaces one still running.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  test:
    name: PostgreSQL ${{ matrix.postgresql }} on ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        # Every push runs the suite on all three platforms, so the nightly run needs only Linux.
        platform: ${{ fromJSON((github.event_name == 'schedule' || inputs.nightly == true) && '["linux-x64"]' || '["linux-x64", "osx-arm64", "win-x64"]') }}
        postgresql: [15, 16, 17, 18, 19]
    runs-on: ${{ matrix.platform == 'linux-x64' && 'ubuntu-24.04' || matrix.platform == 'osx-arm64' && 'macos-15' || 'windows-2025' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          platform: ${{ matrix.platform }}
          postgresql: ${{ matrix.postgresql }}
          release: ${{ (github.event_name == 'schedule' || inputs.nightly == true) }}

      # Generating and compiling the Ankus bindings for a PostgreSQL version takes about two minutes a build. The newest
      # bindings for the Ankus SDK are restored, or else the newest for the version.
      - name: Restore Ankus bindings
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ankus-bindings
          key: ankus-bindings-v2-${{ matrix.platform }}-pg${{ matrix.postgresql }}-${{ hashFiles('global.json') }}-${{ github.run_id }}
          restore-keys: |
            ankus-bindings-v2-${{ matrix.platform }}-pg${{ matrix.postgresql }}-${{ hashFiles('global.json') }}-
            ankus-bindings-v2-${{ matrix.platform }}-pg${{ matrix.postgresql }}-

      - name: Build
        id: build
        shell: bash
        run: |
          set -o pipefail
          dotnet ankus build --pg ${{ matrix.postgresql }} --project src/Worf/Worf.csproj | tee "$RUNNER_TEMP/build.log"
          if grep -q "Managed binding compilation: built" "$RUNNER_TEMP/build.log"; then
            echo "compiled-bindings=true" >> "$GITHUB_OUTPUT"
          fi

      # Bindings depend on the PostgreSQL symbols worf uses, so restored ones go stale when worf starts using another.
      # Main saves them again whenever its build compiles them. Pull requests use main's rather than storing their own.
      - name: Save Ankus bindings
        if: steps.build.outputs.compiled-bindings == 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ankus-bindings
          key: ankus-bindings-v2-${{ matrix.platform }}-pg${{ matrix.postgresql }}-${{ hashFiles('global.json') }}-${{ github.run_id }}

      - name: Run regression suite
        if: github.event_name != 'schedule' && inputs.nightly != true
        # A hang fails the step so that its results are saved.
        timeout-minutes: 8
        run: dotnet run eng/regress.cs -- --pg ${{ matrix.postgresql }} --no-build

      - name: Save regression results
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: regression-${{ matrix.platform }}-pg${{ matrix.postgresql }}
          path: |
            src/Worf/pg_regress/results/
            src/Worf/pg_regress/regression.diffs
            artifacts/regress-home/clusters/*.log
          if-no-files-found: ignore
          retention-days: 7

      # The regression suite's timing-sensitive tests run alone, as pglogical's do, so the many clusters of the
      # multi-server tests come after it. Their data goes on D: on Windows rather than C:, which pgbench's commits keep
      # so busy that a backend creating a WAL segment there waits seconds, and an apply worker waiting that long misses
      # t/040's 5-second walsender timeout.
      - name: Run multi-server tests
        if: github.event_name != 'schedule' && inputs.nightly != true && (success() || failure())
        # A hang fails the step, rather than the job's timeout cancelling the job, so that its logs are saved. Each
        # test also times out on its own, in tests/Worf.Tests/testconfig.json.
        timeout-minutes: 12
        env:
          # pglogical's t/040 writes for 120 seconds by default; a shorter run still resynchronizes during writes.
          PGBENCH_TIME: '30'
          # Windows raises the priority of a thread its socket wakes, so ten pgbench backends, woken by every
          # statement, keep the runner's four processors from the resynchronizing copy, the apply and the walsender
          # until the walsender times out. Three leave a processor for them.
          PGBENCH_CLIENTS: ${{ runner.os == 'Windows' && '3' || '10' }}
        run: dotnet ankus test --pg ${{ matrix.postgresql }} -c Release ${{ runner.os == 'Windows' && '--pgdata D:\ankus\pgdata' || '' }} -- --project tests/Worf.Tests/Worf.Tests.csproj --output detailed

      - name: Save multi-server test logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.platform }}-pg${{ matrix.postgresql }}
          path: |
            TestResults/
            src/Worf/bin/ankus-test-logs/*.log
          if-no-files-found: ignore
          retention-days: 7

      # The nightly run's suite runs all come from the stress test, which keeps each failed run's diffs. Two of them
      # fit within 10 minutes even when the job builds PostgreSQL.
      - name: Run stress test
        if: (github.event_name == 'schedule' || inputs.nightly == true) && (success() || failure())
        run: dotnet run eng/stress.cs -- --pg ${{ matrix.postgresql }} --runs 2

      - name: Save stress test results
        if: (github.event_name == 'schedule' || inputs.nightly == true) && failure()
        uses: actions/upload-artifact@v7
        with:
          name: stress-${{ matrix.platform }}-pg${{ matrix.postgresql }}
          path: artifacts/stress/
          if-no-files-found: ignore
          retention-days: 7
