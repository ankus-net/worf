name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  schedule:
    # The nightly run, on Linux, builds PostgreSQL without assertions and adds a stress run.
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      nightly:
        description: Run the nightly configuration
        type: boolean
        default: false

permissions:
  contents: read

# A newer run for the same branch and event replaces one still running.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  test:
    name: PostgreSQL ${{ matrix.postgresql }} on ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        # Every push runs the suite on all three platforms, so the nightly run needs only Linux.
        platform: ${{ fromJSON((github.event_name == 'schedule' || inputs.nightly == true) && '["linux-x64"]' || '["linux-x64", "osx-arm64", "win-x64"]') }}
        postgresql: [15, 16, 17, 18, 19]
    runs-on: ${{ matrix.platform == 'linux-x64' && 'ubuntu-24.04' || matrix.platform == 'osx-arm64' && 'macos-15' || 'windows-2025' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          platform: ${{ matrix.platform }}
          postgresql: ${{ matrix.postgresql }}
          release: ${{ (github.event_name == 'schedule' || inputs.nightly == true) }}

      # Generating and compiling the Ankus bindings for a PostgreSQL version takes about two minutes a build.
      - name: Cache Ankus bindings
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ankus-bindings
          key: ankus-bindings-v2-${{ matrix.platform }}-pg${{ matrix.postgresql }}-${{ hashFiles('global.json') }}

      - name: Build
        run: dotnet ankus build --pg ${{ matrix.postgresql }} --project src/Worf/Worf.csproj

      # The regression suite and the multi-server tests use separate clusters, so they run side by side on the one
      # build. The tests start once the suite has installed the extension.
      - name: Run regression suite and multi-server tests
        shell: bash
        env:
          NIGHTLY: ${{ (github.event_name == 'schedule' || inputs.nightly == true) && 'true' || '' }}
          # pglogical's t/040 writes for 120 seconds by default; a shorter run still resynchronizes during writes.
          PGBENCH_TIME: '30'
        run: |
          log="$RUNNER_TEMP/regress.log"
          dotnet run eng/regress.cs -- --pg ${{ matrix.postgresql }} --no-build > "$log" 2>&1 &
          regress=$!
          tests=0
          if [ -z "$NIGHTLY" ]; then
            until grep -q '^Regression run' "$log" || ! kill -0 $regress 2> /dev/null; do sleep 1; done
            dotnet ankus test --pg ${{ matrix.postgresql }} -c Release -- --project tests/Worf.Tests/Worf.Tests.csproj --output detailed || tests=$?
          fi
          suite=0
          wait $regress || suite=$?
          echo "::group::Regression suite"
          cat "$log"
          echo "::endgroup::"
          [ "$suite" -eq 0 ] && [ "$tests" -eq 0 ]

      - name: Save regression results
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: regression-${{ matrix.platform }}-pg${{ matrix.postgresql }}
          path: |
            src/Worf/pg_regress/results/
            src/Worf/pg_regress/regression.diffs
            artifacts/regress-home/clusters/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Save multi-server test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.platform }}-pg${{ matrix.postgresql }}
          path: |
            TestResults/
            src/Worf/bin/ankus-test-logs/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Run stress test
        if: (github.event_name == 'schedule' || inputs.nightly == true) && (success() || failure())
        run: dotnet run eng/stress.cs -- --pg ${{ matrix.postgresql }} --runs 5

      - name: Save stress test results
        if: (github.event_name == 'schedule' || inputs.nightly == true) && failure()
        uses: actions/upload-artifact@v7
        with:
          name: stress-${{ matrix.platform }}-pg${{ matrix.postgresql }}
          path: artifacts/stress/
          if-no-files-found: ignore
          retention-days: 7
