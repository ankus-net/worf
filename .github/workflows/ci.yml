name: CI

on:
  push:
  pull_request:
  workflow_call:
  schedule:
    # The nightly run builds PostgreSQL without assertions and adds the huge_tx tests and a stress run.
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      nightly:
        description: Run the nightly configuration
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  test:
    name: PostgreSQL ${{ matrix.postgresql }} on ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x64, osx-arm64, win-x64]
        postgresql: [13, 14, 15, 16, 17, 18, 19]
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: osx-arm64
            runner: macos-15
          - platform: win-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.nightly == true) && 360 || 120 }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          platform: ${{ matrix.platform }}
          postgresql: ${{ matrix.postgresql }}
          release: ${{ (github.event_name == 'schedule' || inputs.nightly == true) }}

      # huge_tx_100k_tables needs about 30 GB of disk, more than a macOS runner has free.
      - name: Free disk space (macOS)
        if: runner.os == 'macOS' && (github.event_name == 'schedule' || inputs.nightly == true)
        run: |
          df -h /
          xcrun simctl runtime delete all || true
          selected=$(realpath "$(xcode-select -p)/../..")
          for xcode in /Applications/Xcode*.app; do
            [ -L "$xcode" ] || [ "$(realpath "$xcode")" = "$selected" ] || sudo rm -rf "$xcode"
          done
          rm -rf ~/Library/Android
          df -h /

      - name: Run regression suite
        run: dotnet run eng/regress.cs -- --pg ${{ matrix.postgresql }} ${{ (github.event_name == 'schedule' || inputs.nightly == true) && '--huge-tx' || '' }}

      - name: Save regression results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regression-${{ matrix.platform }}-pg${{ matrix.postgresql }}
          path: |
            src/Worf/pg_regress/results/
            src/Worf/pg_regress/regression.diffs
            artifacts/regress-home/clusters/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Run multi-server tests
        if: success() || failure()
        run: dotnet ankus test --pg ${{ matrix.postgresql }} -- --project tests/Worf.Tests/Worf.Tests.csproj

      - name: Save multi-server test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.platform }}-pg${{ matrix.postgresql }}
          path: |
            TestResults/
            src/Worf/bin/ankus-test-logs/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Run stress test
        if: (github.event_name == 'schedule' || inputs.nightly == true) && (success() || failure())
        run: dotnet run eng/stress.cs -- --pg ${{ matrix.postgresql }} --runs 5

      - name: Save stress test results
        if: (github.event_name == 'schedule' || inputs.nightly == true) && failure()
        uses: actions/upload-artifact@v7
        with:
          name: stress-${{ matrix.platform }}-pg${{ matrix.postgresql }}
          path: artifacts/stress/
          if-no-files-found: ignore
          retention-days: 7
