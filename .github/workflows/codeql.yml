name: CodeQL

on:
  # No analyzed language reads Markdown, so commits that change only Markdown are not scanned again.
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  schedule:
    - cron: '41 8 * * 2'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

# A newer run for the same branch and event replaces one still running.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # JavaScript and TypeScript are the documentation site.
        language: [actions, csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # These languages are read from source, so the scan needs neither a build nor PostgreSQL.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          output: artifacts/codeql-results

      - name: Archive CodeQL results
        uses: actions/upload-artifact@v7
        with:
          name: codeql-results-${{ matrix.language }}-${{ github.run_attempt }}
          path: artifacts/codeql-results/**/*.sarif
          if-no-files-found: error

      # Code scanning lists findings without failing anything, so a new one would go unseen.
      - name: Require zero findings
        run: dotnet run eng/codeql.cs -- artifacts/codeql-results
