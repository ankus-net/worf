name: CodeQL

on:
  # No analyzed language reads Markdown, so commits that change only Markdown are not scanned again.
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  schedule:
    - cron: '41 8 * * 2'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

# A newer run for the same branch and event replaces one still running.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          # Most of the C# calls PostgreSQL through types Ankus generates in the build, so the scan follows a build.
          - language: csharp
            build-mode: manual
          # JavaScript and TypeScript are the documentation site.
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        if: matrix.build-mode == 'none'
        with:
          global-json-file: global.json

      - uses: ./.github/actions/setup
        if: matrix.build-mode == 'manual'
        with:
          platform: linux-x64
          postgresql: 18

      # Ankus compiles its bindings once and reuses them, so the scan reads worf and not the generated bindings.
      - name: Cache Ankus bindings
        if: matrix.build-mode == 'manual'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ankus-bindings
          key: ankus-bindings-v2-linux-x64-pg18-${{ hashFiles('global.json') }}
          # Ankus checks restored bindings before reusing them, so a global.json change that leaves the Ankus SDK alone,
          # such as a test SDK update, starts from the last cache rather than generating them again.
          restore-keys: ankus-bindings-v2-linux-x64-pg18-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql-config.yml

      # The engineering apps are file-based apps outside the solution, so they build on their own.
      - name: Build
        if: matrix.build-mode == 'manual'
        run: |
          dotnet build Worf.slnx -c Release
          for app in eng/*.cs; do
            dotnet build "$app"
          done

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          output: artifacts/codeql-results
          upload: never

      # The traced C# build also compiles what the Ankus and regular expression source generators write under obj/,
      # code worf does not own, so its results stay out of both code scanning and the check below.
      - name: Drop results in generated code
        run: dotnet run eng/codeql.cs -- drop-generated artifacts/codeql-results

      - name: Upload CodeQL results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: artifacts/codeql-results
          category: /language:${{ matrix.language }}

      - name: Archive CodeQL results
        uses: actions/upload-artifact@v7
        with:
          name: codeql-results-${{ matrix.language }}-${{ github.run_attempt }}
          path: artifacts/codeql-results/**/*.sarif
          if-no-files-found: error

      # Code scanning lists findings without failing anything, so a new one would go unseen.
      - name: Require zero findings
        run: dotnet run eng/codeql.cs -- artifacts/codeql-results
