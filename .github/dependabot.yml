# Dependabot reads this file from the default branch and opens a pull request for each update it finds.
version: 2
updates:
  # Directory.Packages.props holds the test packages, and global.json the SDKs. The Ankus packages and tool move
  # together with `ankus upgrade`, following each release's notes, so Dependabot leaves them alone.
  - package-ecosystem: nuget
    directories:
      - /
      - /src/*
      - /tests/*
    schedule:
      interval: weekly
    assignees:
      - willibrandon
    labels:
      - dependencies
    ignore:
      - dependency-name: Ankus.*

  # The actions the workflows and their composite actions use, grouped since they are tested together anyway. The root
  # covers only the workflows, so the composite actions' directories are listed too.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    assignees:
      - willibrandon
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"

  # The documentation site. Its packages never reach worf, so they also arrive as one pull request.
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    assignees:
      - willibrandon
    labels:
      - dependencies
    groups:
      docs:
        patterns:
          - "*"
