name: Set up
description: Installs .NET, LLVM, the Ankus tools and a PostgreSQL release for building and testing worf.

inputs:
  platform:
    description: The runtime identifier, such as linux-x64.
    required: true
  postgresql:
    description: The PostgreSQL major version.
    required: true
  release:
    description: Whether to build PostgreSQL without assertions, as the nightly run's long tests do.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Select LLVM and diff, and keep .NET on the fast drive (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        echo "C:\\Program Files\\LLVM\\bin" >> "$GITHUB_PATH"
        echo "C:\\Program Files\\Git\\usr\\bin" >> "$GITHUB_PATH"
        # The runner's C: drive is much slower than D:, which holds the workspace, so keep .NET and packages on D: too.
        echo "DOTNET_INSTALL_DIR=D:\\dotnet" >> "$GITHUB_ENV"
        echo "NUGET_PACKAGES=D:\\nuget\\packages" >> "$GITHUB_ENV"

    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Install LLVM and PostgreSQL build dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor --yes --output /usr/share/keyrings/llvm.gpg
        echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-20 main" | sudo tee /etc/apt/sources.list.d/llvm.list
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends clang-20 libclang-20-dev bison flex libreadline-dev zlib1g-dev libicu-dev pkg-config
        echo /usr/lib/llvm-20/bin >> "$GITHUB_PATH"

    - name: Install LLVM and PostgreSQL build dependencies (macOS)
      if: runner.os == 'macOS'
      env:
        HOMEBREW_NO_AUTO_UPDATE: '1'
      shell: bash
      run: |
        # Homebrew links a versioned LLVM only when no other version is installed; with the runner image's
        # llvm@18 present it leaves llvm@20 unlinked and warns.
        if brew list --versions llvm@18 > /dev/null; then brew uninstall --ignore-dependencies llvm@18; fi
        brew install llvm@20 icu4c pkg-config
        echo "$(brew --prefix llvm@20)/bin" >> "$GITHUB_PATH"

    - name: Keep PostgreSQL and temporary files on the fast drive (Windows)
      # Every PostgreSQL backend on Windows is a new process that loads the installation's binaries, so they belong
      # on D: rather than the much slower C:, and outside real-time scanning. Temporary files, where Ankus compiles
      # bindings and the tests copy installations and data directories, go there too, in a directory the runner's
      # account owns: pg_ctl starts the server without the account's administrator rights, which the runner's own
      # temporary directory requires.
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path D:\ankus | Out-Null
        New-Item -ItemType Junction -Path "$HOME\.ankus" -Target D:\ankus | Out-Null
        New-Item -ItemType Directory -Force -Path D:\temp | Out-Null
        icacls D:\temp /grant "${env:USERNAME}:(OI)(CI)F" | Out-Null
        "TEMP=D:\temp" >> $env:GITHUB_ENV
        "TMP=D:\temp" >> $env:GITHUB_ENV
        Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue

    - name: Place the Ankus binding cache
      shell: bash
      run: echo "AnkusBindingCacheDirectory=$RUNNER_TEMP/ankus-bindings" >> "$GITHUB_ENV"

    - name: Restore tools
      shell: bash
      run: dotnet tool restore

    # Each installation is saved under the Ankus version that installed it and its directory, which names its release
    # and Ankus's build of it, so that a new minor release, which ankus init downloads, is saved too. The newest
    # installation for the Ankus version is restored, or else the newest for the major version: an Ankus update starts
    # from the last installation, which ankus init reuses when the update leaves its build alone, rather than
    # downloading or building PostgreSQL again.
    - name: Key PostgreSQL
      id: postgresql-keys
      shell: bash
      run: |
        prefix='postgresql-v1-${{ inputs.platform }}${{ inputs.release == 'true' && '-release' || '' }}-pg${{ inputs.postgresql }}'
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "ankus=$prefix-${{ hashFiles('.config/dotnet-tools.json') }}" >> "$GITHUB_OUTPUT"

    - name: Restore PostgreSQL
      id: postgresql-cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.ankus/postgres
        key: ${{ steps.postgresql-keys.outputs.ankus }}-
        restore-keys: |
          ${{ steps.postgresql-keys.outputs.ankus }}-
          ${{ steps.postgresql-keys.outputs.prefix }}-

    - name: Install PostgreSQL source build tools (Windows)
      # EDB publishes no Windows archive for a PostgreSQL release candidate, so ankus init builds it from source, unless
      # this Ankus version installed it before.
      if: >-
        runner.os == 'Windows' && inputs.postgresql == '19' &&
        !startsWith(steps.postgresql-cache.outputs.cache-matched-key, format('{0}-', steps.postgresql-keys.outputs.ankus))
      shell: pwsh
      run: |
        python -m pip install --quiet meson ninja
        choco install winflexbison3 --no-progress -y
        # Git's MSYS Perl, also on the PATH, rewrites the MSVC tools' /options as paths.
        "C:\Strawberry\perl\bin" >> $env:GITHUB_PATH

    - name: Install PostgreSQL
      id: postgresql
      shell: bash
      env:
        ANKUS_KEY: ${{ steps.postgresql-keys.outputs.ankus }}
      run: |
        dotnet ankus init ${{ inputs.release == 'true' && '--release' || '' }} --pg${{ inputs.postgresql }} download
        installation=$(dotnet ankus info path ${{ inputs.postgresql }} | tr -d '\r')
        installation=${installation%[\\/]}
        echo "directory=${installation##*[\\/]}" >> "$GITHUB_OUTPUT"
        echo "key=$ANKUS_KEY-${installation##*[\\/]}" >> "$GITHUB_OUTPUT"

    # Saved as soon as it's installed, so a later failing step doesn't make the next run build it again, and only when
    # the cache didn't have it. Only main stores installations: every branch and tag can restore main's, while copies of
    # their own, which only they can restore, crowd main's out of the cache.
    - name: Prune PostgreSQL
      # An installation ankus init replaced stays beside the new one.
      if: github.ref == 'refs/heads/main' && steps.postgresql-cache.outputs.cache-matched-key != steps.postgresql.outputs.key
      shell: bash
      env:
        INSTALLATION: ${{ steps.postgresql.outputs.directory }}
      run: find ~/.ankus/postgres -mindepth 1 -maxdepth 1 -type d ! -name "$INSTALLATION" -prune -exec rm -rf {} +

    - name: Save PostgreSQL
      if: github.ref == 'refs/heads/main' && steps.postgresql-cache.outputs.cache-matched-key != steps.postgresql.outputs.key
      uses: actions/cache/save@v6
      with:
        path: ~/.ankus/postgres
        key: ${{ steps.postgresql.outputs.key }}
